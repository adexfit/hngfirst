<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="common.css" />
    <link rel="stylesheet" type="text/css" href="contact.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Contact</title>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo"><a href="index.html">BabyE</a></div>

      <input type="checkbox" id="menu-toggle" />
      <label for="menu-toggle" class="menu-icon">&#9776;</label>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <main>
      <div id="success-group">
        <p data-testid="test-contact-success" id="success"></p>
      </div>
      <form id="contactForm" novalidate>
        <h1>Contact me</h1>
        <div class="form-group" id="name-group">
          <label for="name">Full name</label>
          <input
            type="text"
            id="name"
            name="name"
            aria-describedby="nameError"
            required
            data-testid="test-contact-name"
          />
          <p
            id="nameError"
            class="error-message"
            data-testid="test-contact-error-name"
          >
            Full name is required.
          </p>
        </div>

        <div class="form-group" id="email-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            aria-describedby="emailError"
            required
            data-testid="test-contact-email"
          />
          <p
            id="emailError"
            class="error-message"
            data-testid="test-contact-error-email"
          >
            Please enter a valid email address.
          </p>
        </div>

        <div class="form-group" id="subject-group">
          <label for="subject">Subject</label>
          <input
            type="text"
            id="subject"
            name="subject"
            aria-describedby="subjectError"
            required
            data-testid="test-contact-subject"
          />
          <p
            id="subjectError"
            class="error-message"
            data-testid="test-contact-error-subject"
          >
            Subject is required.
          </p>
        </div>

        <div class="form-group" id="message-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            aria-describedby="messageError"
            rows="5"
            minlength="10"
            required
            data-testid="test-contact-message"
          ></textarea>
          <p
            id="messageError"
            class="error-message"
            data-testid="test-contact-error-message"
          >
            Message must be at least 10 characters long.
          </p>
        </div>

        <button type="submit" data-testid="test-contact-submit">
          Send Message
        </button>
      </form>
    </main>
    <script src="contact.js"></script>
  </body>
</html>
