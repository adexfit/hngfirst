<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="common.css" />
    <link rel="stylesheet" type="text/css" href="contact.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Contact</title>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">BabyE</div>

      <input type="checkbox" id="menu-toggle" />
      <label for="menu-toggle" class="menu-icon">&#9776;</label>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <main class="">
      <form id="contactForm" novalidate>
        <h1>Contact me</h1>
        <div class="form-group" id="name-group">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            aria-describedby="nameError"
            required
          />
          <p id="nameError" class="error-message">Name is required.</p>
        </div>

        <div class="form-group" id="email-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            aria-describedby="emailError"
            required
          />
          <p id="emailError" class="error-message">
            Please enter a valid email address.
          </p>
        </div>

        <div class="form-group" id="message-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            aria-describedby="messageError"
            rows="5"
            minlength="10"
            required
          ></textarea>
          <p id="messageError" class="error-message">
            Message must be at least 10 characters long.
          </p>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </main>
    <script src="contact.js"></script>
  </body>
</html>
